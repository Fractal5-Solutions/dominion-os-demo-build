name: Credential defaults remediation once

on:
  push:
    branches:
      - fix/security-workflow-sha-pinning-20260730
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: credential-defaults-remediation-once
  cancel-in-progress: true

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: fix/security-workflow-sha-pinning-20260730
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.10'

      - name: Remove hard-coded local credential defaults
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          compose_files = [
              Path('scripts/docker-compose.yml'),
              Path('backups/20260309_024913/scripts/docker-compose.yml'),
          ]
          generator_files = [
              Path('scripts/phi_cost_minimization_engine.sh'),
              Path('scripts/phi_cost_minimization_simple.sh'),
              Path('backups/20260309_024913/scripts/phi_cost_minimization_engine.sh'),
              Path('backups/20260309_024913/scripts/phi_cost_minimization_simple.sh'),
          ]

          replacements = {
              '      POSTGRES_PASSWORD: sovereign_password':
                  '      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in scripts/.env}',
              '      GF_SECURITY_ADMIN_PASSWORD: sovereign_admin':
                  '      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in scripts/.env}',
          }

          for path in compose_files:
              text = path.read_text(encoding='utf-8')
              for old, new in replacements.items():
                  if text.count(old) != 1:
                      raise SystemExit(f'{path}: expected exactly one occurrence of {old!r}')
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')

          for path in generator_files:
              text = path.read_text(encoding='utf-8')
              marker = 'cat > "$DOCKER_COMPOSE_FILE" << EOF'
              if text.count(marker) != 1:
                  raise SystemExit(f'{path}: expected exactly one unquoted compose heredoc')
              text = text.replace(marker, 'cat > "$DOCKER_COMPOSE_FILE" <<\'EOF\'')
              for old, new in replacements.items():
                  if text.count(old) != 1:
                      raise SystemExit(f'{path}: expected exactly one occurrence of {old!r}')
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')

          env_example = Path('scripts/.env.example')
          text = env_example.read_text(encoding='utf-8')
          anchor = 'POSTGRES_PASSWORD=change_this_postgres_password\n'
          addition = anchor + 'GRAFANA_ADMIN_PASSWORD=change_this_grafana_admin_password\n'
          if text.count(anchor) != 1:
              raise SystemExit('scripts/.env.example: expected one Postgres placeholder')
          if 'GRAFANA_ADMIN_PASSWORD=' not in text:
              text = text.replace(anchor, addition)
          env_example.write_text(text, encoding='utf-8')

          workflow = Path('.github/workflows/credential-defaults-remediation-once.yml')
          workflow.unlink()
          PY

      - name: Verify scanner and shell syntax
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_secret_scan.py'
          python scripts/secret_scan.py
          bash -n scripts/phi_cost_minimization_engine.sh
          bash -n scripts/phi_cost_minimization_simple.sh
          bash -n backups/20260309_024913/scripts/phi_cost_minimization_engine.sh
          bash -n backups/20260309_024913/scripts/phi_cost_minimization_simple.sh

      - name: Commit verified remediation
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/credential-defaults-remediation-once.yml \
            scripts/.env.example \
            scripts/docker-compose.yml \
            scripts/phi_cost_minimization_engine.sh \
            scripts/phi_cost_minimization_simple.sh \
            backups/20260309_024913/scripts/docker-compose.yml \
            backups/20260309_024913/scripts/phi_cost_minimization_engine.sh \
            backups/20260309_024913/scripts/phi_cost_minimization_simple.sh
          git commit -m "fix(security): require injected local database and Grafana credentials [generated]"
          git push origin HEAD:fix/security-workflow-sha-pinning-20260730
