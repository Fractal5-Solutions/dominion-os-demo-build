name: Windows Google evaluation public claims gate
on:
  pull_request:
    paths:
      - 'demo/assets/windows-google-evaluation-readiness.v1.json'
      - 'scripts/verify_windows_google_evaluation_gates.py'
      - 'tests/test_windows_google_evaluation_gates.py'
      - '.github/workflows/windows-google-evaluation-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: python3 scripts/verify_windows_google_evaluation_gates.py
      - run: python3 -m unittest discover -s tests -p 'test_windows_google_evaluation_gates.py' -v
