name: Read-only live Dominion OS preflight

on:
  push:
    branches: [qa/live-dominion-os-preflight-20260927]
    paths: [.github/workflows/read-only-live-dominion-os-preflight.yml]

permissions:
  contents: read

concurrency:
  group: read-only-live-dominion-os-preflight
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Capture public source and native Chrome rendering
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime, hashlib, json, os, pathlib, re, shutil, subprocess, tempfile, urllib.request
          from html.parser import HTMLParser
          url = 'https://www.fractal5solutions.com/dominion-os'
          out = pathlib.Path('live-preflight').resolve()
          out.mkdir()
          request = urllib.request.Request(url, headers={'User-Agent':'Fractal5-ReadOnly-Website-Preflight/1.0','Cache-Control':'no-cache','Pragma':'no-cache','Accept-Encoding':'identity'})
          with urllib.request.urlopen(request, timeout=30) as response:
              if response.geturl().split('?',1)[0] != url:
                  raise RuntimeError('Unexpected public URL redirect')
              data = response.read(2_000_001)
              if len(data) > 2_000_000:
                  raise RuntimeError('Public response exceeded bounded size')
              status = response.status
              headers = {key:response.headers.get(key) for key in ['Date','ETag','Last-Modified','Age','Cache-Control']}
          source = data.decode('utf-8')
          (out/'live-source.html').write_text(source,encoding='utf-8')
          class Scan(HTMLParser):
              def __init__(self):
                  super().__init__(); self.blocks=[]; self.builds=[]
              def handle_starttag(self,tag,attrs):
                  attrs=dict(attrs)
                  if 'sqs-block-code' in attrs.get('class','').split(): self.blocks.append(attrs.get('id'))
                  if attrs.get('data-page-build'): self.builds.append(attrs['data-page-build'])
          scan=Scan(); scan.feed(source)
          receipt={'schema':'fractal5.public-page-preflight.v1','url':url,'capturedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),'httpStatus':status,'responseSha256':hashlib.sha256(data).hexdigest(),'bytes':len(data),'headers':headers,'codeBlockIds':scan.blocks,'buildMarkers':scan.builds,'sourceHead':os.environ.get('GITHUB_SHA'),'siteMutation':False,'secretsUsed':False,'browser':{}}
          chrome=shutil.which('google-chrome') or shutil.which('google-chrome-stable') or shutil.which('chromium')
          if chrome:
              for label,width,height in [('desktop',1440,1100),('mobile',390,844)]:
                  with tempfile.TemporaryDirectory(prefix='f5-public-preflight-') as profile:
                      command=[chrome,'--headless=new','--disable-dev-shm-usage','--no-first-run','--no-default-browser-check','--user-data-dir='+profile,'--window-size='+str(width)+','+str(height),'--timeout=20000','--screenshot='+str(out/('live-'+label+'.png')),'--dump-dom',url]
                      try:
                          result=subprocess.run(command,capture_output=True,text=True,timeout=45)
                          if result.stdout:
                              (out/('rendered-'+label+'.html')).write_text(result.stdout,encoding='utf-8')
                          receipt['browser'][label]={'exitCode':result.returncode,'screenshotPresent':(out/('live-'+label+'.png')).exists(),'domCaptured':bool(result.stdout),'width':width,'height':height}
                      except subprocess.TimeoutExpired:
                          receipt['browser'][label]={'status':'TIMEOUT','screenshotPresent':(out/('live-'+label+'.png')).exists(),'width':width,'height':height}
          else:
              receipt['browser']={'status':'NATIVE_CHROME_UNAVAILABLE'}
          (out/'receipt.json').write_text(json.dumps(receipt,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(receipt,indent=2))
          PY
      - name: Retain read-only preflight evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: live-dominion-os-preflight
          path: live-preflight/
          retention-days: 3
          if-no-files-found: error
