name: Public proof Phi boundary

on:
  pull_request:
    paths:
      - 'policy/public_proof_phi_boundary.yaml'
      - 'policy/public_artifact_manifest.yaml'
      - '**/*.sh'
      - '**/*.py'
      - '**/*.yml'
      - '**/*.yaml'
      - '.github/CODEOWNERS'
      - '.github/workflows/public-proof-phi-boundary.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enforce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Validate public proof policy
        shell: bash
        run: |
          set -euo pipefail
          policy='policy/public_proof_phi_boundary.yaml'
          test -f "$policy"
          grep -Fq 'phi_is_sole_dominion_command_service: true' "$policy"
          grep -Fq 'public_repo_may_command_phi_mcp: false' "$policy"
          grep -Fq 'public_repo_may_command_dominion_services: false' "$policy"
          grep -Fq 'public_repo_may_start_private_runtime: false' "$policy"
          grep -Fq 'public_repo_may_contain_secrets_or_signing_material: false' "$policy"
          grep -Fq 'public_repo_may_call_credential_bearing_business_integrations: false' "$policy"
          grep -Fq 'public_repo_may_harvest_private_business_or_crm_data: false' "$policy"
          grep -Fq 'public_repo_may_write_private_business_or_crm_data: false' "$policy"

      - name: Validate artifact-only migration contract
        shell: bash
        run: |
          set -euo pipefail
          manifest='policy/public_artifact_manifest.yaml'
          test -f "$manifest"
          grep -Fq 'target_state: artifact_only' "$manifest"
          grep -Fq 'private_runtime_source_allowed: false' "$manifest"
          grep -Fq 'deployment_orchestration_allowed: false' "$manifest"
          grep -Fq 'history_rewrite_in_this_phase: false' "$manifest"
          grep -Fq 'secret_rotation_precedes_history_sanitation: true' "$manifest"

      - name: Validate known compatibility tombstones
        shell: bash
        run: |
          set -euo pipefail
          scripts=(
            'scripts/start_all_local_systems.sh'
            'scripts/telemetry/prove_and_maintain.sh'
            'scripts/phi_sovereign_autopilot_nhitl.sh'
            'scripts/activate_max_sovereign_mode.sh'
            'scripts/phi_ai_continuous_improvement.sh'
            'scripts/gcp_secure_deployment.sh'
            'deploy_demo.sh'
            'deploy_to_gcp.sh'
            'phi_perfect_liveops_deployment.sh'
          )
          failed=0
          for script in "${scripts[@]}"; do
            if [ ! -f "$script" ]; then
              echo "Missing required compatibility tombstone: $script" >&2
              failed=1
              continue
            fi
            if ! bash -n "$script"; then
              echo "Invalid shell syntax in tombstone: $script" >&2
              failed=1
            fi
            if ! grep -Eq 'REFUSED|NON-COMMANDING' "$script"; then
              echo "Missing refusal/non-commanding marker in tombstone: $script" >&2
              failed=1
            fi
          done
          exit "$failed"

      - name: Reject private runtime and privileged integrations
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find . -type f \
            \( -name '*.sh' -o -name '*.py' -o -name '*.yml' -o -name '*.yaml' \) \
            -not -path './.git/*' \
            -not -path './backups/*' \
            -not -path './tests/*' \
            -not -path './.github/workflows/public-proof-phi-boundary.yml' \
            -print)

          forbidden=(
            '/workspaces/phi-mcp-server'
            '/workspaces/dominion-command-center'
            'tools/call'
            'python3 main.py'
            'docker-compose up'
            'docker compose up'
            'gcloud projects add-iam-policy-binding'
            'gcloud iam service-accounts create'
            'gcloud services enable'
            'gcloud run deploy'
            'gcloud builds submit'
            'gcloud config set project dominion-core-prod'
            'gcloud config set project dominion-os-1-0-main'
            'nohup python3 main.py'
            'api.apollo.io'
            'X-API-Key: $APOLLO_API_KEY'
            'data/apollo_crm'
          )

          failed=0
          for file in "${files[@]}"; do
            for token in "${forbidden[@]}"; do
              if grep -Fq "$token" "$file"; then
                echo "Forbidden public proof-lane command/integration token in $file: $token" >&2
                failed=1
              fi
            done
          done
          exit "$failed"

      - name: Reject destructive autonomous maintenance in public scripts
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find scripts -type f -name '*.sh' -not -path 'scripts/backups/*' -print 2>/dev/null || true)
          forbidden=(
            'rm -rf'
            '-delete'
            'git reset --hard'
            'git push --force'
            'git push -f'
          )
          failed=0
          for file in "${files[@]}"; do
            for token in "${forbidden[@]}"; do
              if grep -Fq -- "$token" "$file"; then
                echo "Forbidden destructive public maintenance token in $file: $token" >&2
                failed=1
              fi
            done
          done
          exit "$failed"

      - name: Enforce boundary code ownership
        shell: bash
        run: |
          set -euo pipefail
          owners='.github/CODEOWNERS'
          grep -Fq 'policy/**' "$owners"
          grep -Fq 'scripts/**' "$owners"
          grep -Fq '*.sh' "$owners"
          grep -Fq '.github/workflows/public-proof-phi-boundary.yml' "$owners"
