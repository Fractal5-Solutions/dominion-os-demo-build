name: Public proof Phi boundary

on:
  pull_request:
    paths:
      - 'policy/public_proof_phi_boundary.yaml'
      - 'scripts/start_all_local_systems.sh'
      - 'scripts/telemetry/prove_and_maintain.sh'
      - 'scripts/phi_sovereign_autopilot_nhitl.sh'
      - '.github/workflows/public-proof-phi-boundary.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enforce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Validate public proof policy
        shell: bash
        run: |
          set -euo pipefail
          policy='policy/public_proof_phi_boundary.yaml'
          test -f "$policy"
          grep -Fq 'phi_is_sole_dominion_command_service: true' "$policy"
          grep -Fq 'public_repo_may_command_phi_mcp: false' "$policy"
          grep -Fq 'public_repo_may_command_dominion_services: false' "$policy"
          grep -Fq 'public_repo_may_start_private_runtime: false' "$policy"
          grep -Fq 'public_repo_may_contain_secrets_or_signing_material: false' "$policy"

      - name: Enforce non-commanding public compatibility scripts
        shell: bash
        run: |
          set -euo pipefail
          scripts=(
            'scripts/start_all_local_systems.sh'
            'scripts/telemetry/prove_and_maintain.sh'
            'scripts/phi_sovereign_autopilot_nhitl.sh'
          )
          forbidden=(
            'python3 main.py'
            'pip install'
            'docker-compose up'
            'docker compose up'
            '/workspaces/phi-mcp-server'
            'tools/call'
            'gcloud config set project'
            'nohup '
          )
          for script in "${scripts[@]}"; do
            bash -n "$script"
            for token in "${forbidden[@]}"; do
              if grep -Fq "$token" "$script"; then
                echo "Forbidden public proof-lane runtime orchestration token in $script: $token" >&2
                exit 1
              fi
            done
          done
          grep -Fq 'Phi is the sole Dominion command service.' 'scripts/start_all_local_systems.sh'
          grep -Fq 'NON-COMMANDING / SANDBOX-ONLY' 'scripts/start_all_local_systems.sh'
          grep -Fq 'Phi is the sole Dominion command service.' 'scripts/telemetry/prove_and_maintain.sh'
          grep -Fq 'Phi is the sole Dominion command service.' 'scripts/phi_sovereign_autopilot_nhitl.sh'
