name: Canon Demo Page Prepublication

on:
  pull_request:
    branches: [main]
    paths:
      - 'squarespace/demo-1-v4-4-production-preflight.html'
      - 'demo/portable-public-mission-v4.3.html'
      - 'scripts/test_demo_page_production.py'
      - 'scripts/test_demo_windows_offline.py'
      - '.github/workflows/ci-demo-page-prepublication.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canon-demo-prepublication:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout proposed review revision
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - name: Install pinned browser test dependencies
        run: |
          python3 -m pip install --disable-pip-version-check beautifulsoup4==4.14.3 playwright==1.55.0
          python3 -m playwright install --with-deps chromium
      - name: Verify Canon page, browser interactions, and byte-exact offline download
        env:
          F5_DEMO_QA_REPORT: prepublication-v44-results.json
        run: python3 scripts/test_demo_page_production.py
      - name: Print evidence summary
        if: always()
        run: |
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path('prepublication-v44-results.json')
          if not p.exists():
              print('No test report was produced: fail closed')
              raise SystemExit(1)
          r=json.loads(p.read_text(encoding='utf-8'))
          print('Canon prepublication check count:',r['passed'],'/',r['total'])
          print('Review artifact SHA-256:',r['source_sha256'])
          print('Portable demo SHA-256:',r['portable_sha256'])
          if r['passed'] != r['total']:
              raise SystemExit(1)
          PY
  windows-portable-offline:
    name: Windows real file URI / offline mission
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout review source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned Chromium test runtime
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install chromium
      - name: Open actual local HTML in Windows offline Chromium and exercise both missions
        shell: pwsh
        run: python scripts/test_demo_windows_offline.py
      - name: Print Windows acceptance receipt
        if: always()
        shell: pwsh
        run: |
          if (!(Test-Path windows-offline-smoke-results.json)) { throw "Windows offline smoke receipt missing" }
          $r = Get-Content -Raw windows-offline-smoke-results.json | ConvertFrom-Json
          Write-Output "Windows file URI smoke: $($r.passed)/$($r.total)"
          Write-Output "Portable sha256: $($r.sha256)"
          if ($r.passed -ne $r.total) { throw "Windows offline smoke failed" }
