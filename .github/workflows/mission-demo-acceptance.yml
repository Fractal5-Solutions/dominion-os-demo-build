name: Mission demo acceptance

on:
  pull_request:
    paths:
      - demo/live-mission-demo.html
      - demo/dominion-command-preview.html
      - demo/assets/live-mission-video-manifest.json
      - tests/live-mission-demo.test.cjs
      - .github/workflows/publish-artifact-only-pages.yml
      - .github/workflows/mission-demo-acceptance.yml
  push:
    branches: [main]
    paths:
      - demo/live-mission-demo.html
      - demo/dominion-command-preview.html
      - demo/assets/live-mission-video-manifest.json
      - tests/live-mission-demo.test.cjs
      - .github/workflows/publish-artifact-only-pages.yml
      - .github/workflows/mission-demo-acceptance.yml

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - name: Verify Business and Politics authority, reset and isolation
        run: node --test tests/live-mission-demo.test.cjs
