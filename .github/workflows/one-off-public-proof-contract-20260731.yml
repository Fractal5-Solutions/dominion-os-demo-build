name: one-off-public-proof-contract-20260731

on:
  push:
    branches:
      - repair/public-proof-truth-20260731

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: repair/public-proof-truth-20260731
          persist-credentials: true

      - name: Bind canonical source and retire dead media claims
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const watchPath = 'demo/assets/demo-1-watchlist.json';
          const w = JSON.parse(fs.readFileSync(watchPath, 'utf8'));
          w.sourceServedAssets.squarespaceCode = 'https://raw.githubusercontent.com/Fractal5-Solutions/dominion-os-demo-build/main/squarespace/demo-1-final.html';
          w.requiredHardeningAssertions = [
            'MULTI-CLOUD DEPLOYMENT READY',
            'Dominion OS is ready for your cloud.',
            'Ready across four clouds. Governed as one system.',
            'Public demo uptime is optional and independent of client deployment readiness.',
            'Choose the estate. We deploy the system.'
          ];
          fs.writeFileSync(watchPath, JSON.stringify(w, null, 2) + '\n');

          const manifestPath = 'demo/assets/demo-manifest.json';
          const m = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          m.generatedAt = '2026-07-31T15:20:00Z';
          m.assets.videoMp4 = null;
          m.assets.videoMasterMp4 = null;
          m.assetPolicy.runtimeMedia = [];
          m.claimControl.allowDirectMp4Claim = false;
          m.claimControl.reviewedAt = '2026-07-31T15:20:00Z';
          m.claimControl.reason = 'Multi-cloud deployment readiness is source-backed. The live Squarespace publication is stale and the Cloud Run runtime and media routes return 404; direct-runtime and MP4 claims remain disabled until fresh receipts pass.';
          fs.writeFileSync(manifestPath, JSON.stringify(m, null, 2) + '\n');
          NODE

          rm -f .github/workflows/one-off-public-proof-contract-20260731.yml
          git config user.name 'phi-chief-public-proof-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix(public-proof): bind canonical source and retire dead media claims'
          git push origin HEAD:repair/public-proof-truth-20260731
