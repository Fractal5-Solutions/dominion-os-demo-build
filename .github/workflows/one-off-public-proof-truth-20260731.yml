name: one-off-public-proof-truth-20260731

on:
  push:
    branches:
      - repair/public-proof-truth-20260731

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: repair/public-proof-truth-20260731
          persist-credentials: true

      - name: Correct fail-closed public truth state
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const file = 'demo/assets/demo-1-watchlist.json';
          const w = JSON.parse(fs.readFileSync(file, 'utf8'));
          w.generatedAt = '2026-07-31T15:10:00Z';
          w.page.role = 'live Squarespace bridge currently requiring publication of the canonical truthful source before prospect sharing';
          w.requiredAssertions = [
            'DOMINION OS™ + SAAS SUITE · MULTI-CLOUD DEPLOYMENT READY',
            'Dominion OS is ready for your cloud.',
            'Ready across four clouds. Governed as one system.',
            'Public demo uptime is optional and independent of client deployment readiness.',
            'Choose the estate. We deploy the system.'
          ];
          w.claimControl.directMp4CurrentlyAvailable = false;
          w.claimControl.publicBridgeContractCurrentlyAligned = false;
          w.claimControl.fullCommerceGreenCurrentlyAllowed = false;
          w.claimControl.fullCommercialGreenCurrentlyAllowed = false;
          w.claimControl.controlledPreviewCommercialUseAllowed = false;
          w.claimControl.runtimeCopyRepairRequired = true;
          w.claimControl.reason = 'The live Squarespace page still carries stale live-runtime claims and the configured Cloud Run demo, health and status routes return 404. The canonical multi-cloud source is public-safe but is not the live Squarespace publication. No live, MP4, controlled-preview or full-commercial green claim is allowed until publication and fresh runtime receipts pass.';
          fs.writeFileSync(file, JSON.stringify(w, null, 2) + '\n');

          const status = {
            schema: 'f5.demo.public-truth-state.v1',
            generatedAt: '2026-07-31T15:10:00Z',
            sourceHeadBeforeRepair: '8dbf5c99dc4699224424e2afdcd44b847e0dfbc5',
            squarespace: 'RED_STALE_LIVE_CLAIMS',
            cloudRun: {
              demo: 'HTTP_404',
              health: 'HTTP_404',
              status: 'HTTP_404'
            },
            canonicalSource: 'squarespace/demo-1-final.html',
            prospectSharingAllowed: false,
            fullCommercialGreenAllowed: false,
            recovery: [
              'Publish the canonical Squarespace source through an authenticated editor.',
              'Restore least-privilege GitHub-to-GCloud identity and deploy the exact certified source.',
              'Require fresh external 200, no-store and exact-release receipts before green.'
            ]
          };
          fs.writeFileSync('demo/assets/public-truth-status.json', JSON.stringify(status, null, 2) + '\n');
          NODE

          rm -f .github/workflows/one-off-public-proof-truth-20260731.yml
          git config user.name 'phi-chief-public-proof-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix(public-proof): fail closed on stale live claims and 404 runtime'
          git push origin HEAD:repair/public-proof-truth-20260731
