name: PHI Create Pull Request

permissions:
  contents: read

on:
  push:
    branches:
      - 'phi-*'

jobs:
  create-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Create Pull Request to main
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'Create PR: PHI automation updates'
          title: 'PHI Automation: Workflow & Monitor'
          body: |
            This PR contains automation workflows and monitoring scripts added by PHI Sovereign Autopilot.

            - Scheduled monitor
            - PR automation
            - Documentation
          base: main
          branch: ${{ github.ref_name }}
