name: Demo contract reconciliation once

on:
  push:
    branches:
      - fix/security-workflow-sha-pinning-20260730
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: demo-contract-reconciliation-once-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  reconcile:
    if: >-
      github.actor != 'github-actions[bot]' &&
      (github.event_name != 'pull_request' || github.head_ref == 'fix/security-workflow-sha-pinning-20260730')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: fix/security-workflow-sha-pinning-20260730
          fetch-depth: 0

      - name: Reconcile cache and fail-safe link contracts
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          command_core = Path('command_core.py')
          text = command_core.read_text(encoding='utf-8')
          replacements = {
              '        response.headers.setdefault("Cache-Control", "public, max-age=31536000, immutable")':
                  '        response.headers["Cache-Control"] = "public, max-age=31536000, immutable"',
              '        response.headers.setdefault("Cache-Control", "public, max-age=300")':
                  '        response.headers["Cache-Control"] = "public, max-age=300"',
              '        response.headers.setdefault("Cache-Control", "no-store")':
                  '        response.headers["Cache-Control"] = "no-store"',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'command_core.py: expected exactly one {old!r}')
              text = text.replace(old, new)
          command_core.write_text(text, encoding='utf-8')

          test_path = Path('tests/test_demo1_multicloud_source.py')
          text = test_path.read_text(encoding='utf-8')
          old = '''        href = anchor["href"]
        assert (
            href.endswith("/cloud-deployment-manifest.json")
            or href == "https://www.fractal5solutions.com/#contact"
        )
'''
          new = '''        target = anchor["data-runtime-target"]
        href = anchor["href"]
        if target.endswith("/demo"):
            assert href == "#deployment-platforms"
        elif target.endswith("/health"):
            assert href == "https://www.fractal5solutions.com/dominion-os"
        else:
            raise AssertionError(f"Unexpected runtime target: {target}")
        assert href != target
'''
          if text.count(old) != 1:
              raise SystemExit('tests/test_demo1_multicloud_source.py: stale assertion block not found exactly once')
          test_path.write_text(text.replace(old, new), encoding='utf-8')

          workflow = Path('.github/workflows/demo-contract-reconciliation-once.yml')
          workflow.unlink()
          PY

      - name: Verify targeted contracts
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q flask requests pytest
          pytest -q \
            tests/test_command_core.py::test_demo_assets_are_served_with_cache_policy \
            tests/test_demo1_multicloud_source.py::test_runtime_actions_are_additive_and_fail_safe

      - name: Commit verified reconciliation
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/demo-contract-reconciliation-once.yml \
            command_core.py \
            tests/test_demo1_multicloud_source.py
          git commit -m "fix(demo): enforce cache and fail-safe link contracts [generated]"
          git push origin HEAD:fix/security-workflow-sha-pinning-20260730
