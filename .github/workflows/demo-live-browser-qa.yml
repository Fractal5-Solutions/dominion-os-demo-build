name: Public Demo Live Browser QA
on:
  pull_request:
    paths:
      - 'tests/browser_qa/**'
      - '.github/workflows/demo-live-browser-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-readonly-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install fixed Playwright version
        run: |
          python3 -m pip install playwright==1.55.0
          python3 -m playwright install --with-deps chromium
      - name: Execute public-only browser QA
        id: qa
        run: |
          python3 tests/browser_qa/fractal5_live_demo_qa.py --output live-qa-receipt.json --screenshot live-qa.png
          python3 -c "import json,sys; r=json.load(open('live-qa-receipt.json')); print('VERDICT='+r['verdict']); sys.exit(0 if r['verdict']=='PASS' else 1)"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: public-demo-live-browser-qa
          path: |
            live-qa-receipt.json
            live-qa.png
            live-qa-receipt.offline.html
          if-no-files-found: warn
          retention-days: 7
