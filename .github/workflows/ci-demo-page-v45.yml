name: Canon Demo Page v4.5 Prepublication

on:
  pull_request:
    branches: [main]
    paths:
      - 'squarespace/demo-1-v4-5-expiring-free-evaluations.html'
      - 'scripts/test_demo_page_v45.py'
      - '.github/workflows/ci-demo-page-v45.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepublication:
    name: v4.5 local Chromium / Canon / trial fail-closed
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout review SHA
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - name: Install pinned dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check beautifulsoup4==4.14.3 playwright==1.55.0
          python3 -m playwright install --with-deps chromium
      - name: Verify seven responsive widths, Business and Politics controls, exact offline bytes and no public trial activation
        env:
          F5_DEMO_QA_REPORT: prepublication-v45-results.json
        run: python3 scripts/test_demo_page_v45.py
      - name: Emit acceptance receipt
        if: always()
        run: |
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path('prepublication-v45-results.json')
          if not p.is_file():
              print('FAIL CLOSED: Missing v4.5 QA receipt')
              raise SystemExit(1)
          r=json.loads(p.read_text(encoding='utf-8'))
          print('v4.5 Canon/Chromium:',r['passed'],'/',r['total'])
          print('Squarespace source SHA-256:',r['source_sha256'])
          print('Recovered November 1 live baseline SHA-256:',r['baseline_sha256'])
          for c in r['checks']:
              if not c['passed']: print('FAILED:',c['name'])
          if r['passed']!=r['total']: raise SystemExit(1)
          PY
      - name: Save read-only acceptance receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: demo-v45-prepublication-receipt
          path: prepublication-v45-results.json
          if-no-files-found: warn
          retention-days: 14
