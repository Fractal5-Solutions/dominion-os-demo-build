name: Build & Deploy Public Demo (OIDC)

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PUBLIC_DEMO_BASE_URL: https://demo-reduwyf2ra-uc.a.run.app

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    env:
      # Project and identity resource names are identifiers, not credentials.
      # The canonical WIF provider and service-account identity are already
      # source-controlled by the receipt-only authentication probe. Deployment
      # remains explicitly withheld until an operator enables the repository.
      DEPLOY_ENABLED: ${{ vars.ENABLE_OIDC_DEPLOY || 'false' }}
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID || 'f5-prod-command-core' }}
      GCP_PROJECT_NUMBER: ${{ vars.GCP_PROJECT_NUMBER || '732190342674' }}
      WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER || secrets.GCP_WORKLOAD_IDENTITY_PROVIDER || secrets.GCP_WIF_PROVIDER || 'projects/732190342674/locations/global/workloadIdentityPools/fractal5-github-pool/providers/github-provider' }}
      WIF_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT_EMAIL || secrets.GCP_SERVICE_ACCOUNT_EMAIL || secrets.GCP_WIF_SA_EMAIL || 'dominion-demo-oidc-sa@f5-prod-command-core.iam.gserviceaccount.com' }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false

      - name: Preflight deploy prerequisites
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          canonical_provider=""

          if [ "${DEPLOY_ENABLED}" != "true" ]; then
            missing+=("ENABLE_OIDC_DEPLOY is not true")
          fi
          if [ -z "${WIF_PROVIDER}" ]; then
            missing+=("GCP_WORKLOAD_IDENTITY_PROVIDER/GCP_WIF_PROVIDER")
          fi
          if [ -z "${WIF_SERVICE_ACCOUNT}" ]; then
            missing+=("GCP_SERVICE_ACCOUNT_EMAIL/GCP_WIF_SA_EMAIL")
          fi
          if [ -z "${GCP_PROJECT_ID}" ]; then
            missing+=("GCP_PROJECT_ID")
          fi
          if ! [[ "${GCP_PROJECT_NUMBER}" =~ ^[0-9]+$ ]]; then
            missing+=("GCP_PROJECT_NUMBER must be numeric")
          fi

          # google-github-actions/auth requires the full provider resource name:
          # projects/NUMBER/locations/global/workloadIdentityPools/POOL/providers/PROVIDER
          # A legacy POOL/PROVIDER shorthand is normalized only when the numeric
          # project number is known. Any other shape fails closed before STS.
          if [ -n "${WIF_PROVIDER}" ] && [[ "${GCP_PROJECT_NUMBER}" =~ ^[0-9]+$ ]]; then
            if [[ "${WIF_PROVIDER}" =~ ^projects/([0-9]+)/locations/global/workloadIdentityPools/([^/]+)/providers/([^/]+)$ ]]; then
              if [ "${BASH_REMATCH[1]}" != "${GCP_PROJECT_NUMBER}" ]; then
                missing+=("WIF provider project number does not match GCP_PROJECT_NUMBER")
              else
                canonical_provider="${WIF_PROVIDER}"
              fi
            elif [[ "${WIF_PROVIDER}" =~ ^([^/]+)/([^/]+)$ ]]; then
              canonical_provider="projects/${GCP_PROJECT_NUMBER}/locations/global/workloadIdentityPools/${BASH_REMATCH[1]}/providers/${BASH_REMATCH[2]}"
            else
              missing+=("WIF provider must be full resource name or POOL/PROVIDER shorthand")
            fi
          fi

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            printf 'missing=%s\n' "${missing[*]}" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "missing=" >> "$GITHUB_OUTPUT"
          fi
          printf 'provider=%s\n' "${canonical_provider}" >> "$GITHUB_OUTPUT"

          echo "project=${GCP_PROJECT_ID}"
          echo "project_number=${GCP_PROJECT_NUMBER}"
          if [ -n "${canonical_provider}" ]; then
            echo "provider=${canonical_provider##*/}"
          else
            echo "provider=absent-or-invalid"
          fi
          if [ -n "${WIF_SERVICE_ACCOUNT}" ]; then
            echo "service_account_domain=${WIF_SERVICE_ACCOUNT#*@}"
          else
            echo "service_account_domain=absent"
          fi

      - name: Write withheld receipt
        if: steps.preflight.outputs.ready != 'true'
        env:
          MISSING_CONTROLS: ${{ steps.preflight.outputs.missing }}
        run: |
          set -euo pipefail
          mkdir -p out/deploy-receipt
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone

          receipt = {
              "schema": "f5.public-demo.deploy-receipt.v1",
              "generatedAt": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
              "expectedSha": os.environ["GITHUB_SHA"],
              "projectId": os.environ.get("GCP_PROJECT_ID", ""),
              "projectNumber": os.environ.get("GCP_PROJECT_NUMBER", ""),
              "state": "WITHHELD",
              "pass": False,
              "reason": os.environ.get("MISSING_CONTROLS", "deployment prerequisites absent"),
              "certificationRule": "A withheld or missing deployment is never public-demo GREEN.",
          }
          with open("out/deploy-receipt/public-demo-deploy.json", "w", encoding="utf-8") as handle:
              json.dump(receipt, handle, indent=2)
              handle.write("\n")
          print(json.dumps(receipt, indent=2))
          PY

      - name: Authenticate to Google Cloud
        if: steps.preflight.outputs.ready == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ steps.preflight.outputs.provider }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        if: steps.preflight.outputs.ready == 'true'
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          version: ">= 363.0.0"

      - name: Submit Cloud Build
        if: steps.preflight.outputs.ready == 'true'
        run: |
          set -euo pipefail
          REF="${GITHUB_REF##*/}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${REF}"
          else
            TAG="${GITHUB_SHA}"
          fi

          gcloud builds submit \
            --project="${GCP_PROJECT_ID}" \
            --config=cloudbuild.yaml \
            --substitutions=_TAG="${TAG}",_REGION=us-central1,_SERVICE_NAME=demo,_AR_REPO=dominion-demo-repo,_APP_VERSION="${GITHUB_SHA}"

      - name: Verify public deployment
        if: steps.preflight.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/deploy-receipt
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request
          from datetime import datetime, timezone

          base = os.environ["PUBLIC_DEMO_BASE_URL"].rstrip("/")
          expected_sha = os.environ["GITHUB_SHA"]
          paths = ["/demo", "/health", "/status"]
          attempts = 18
          delay = 10
          last = None

          for _ in range(attempts):
              results = []
              try:
                  for path in paths:
                      request = urllib.request.Request(
                          base + path,
                          headers={"User-Agent": "fractal5-deploy-verifier/1.0"},
                      )
                      with urllib.request.urlopen(request, timeout=20) as response:
                          body = response.read().decode("utf-8", errors="replace")
                          results.append({
                              "path": path,
                              "status": response.status,
                              "contentType": response.headers.get("content-type", ""),
                              "cacheControl": response.headers.get("cache-control", ""),
                              "body": body,
                          })

                  health = json.loads(next(item["body"] for item in results if item["path"] == "/health"))
                  status = json.loads(next(item["body"] for item in results if item["path"] == "/status"))
                  demo_body = next(item["body"] for item in results if item["path"] == "/demo").lower()
                  forbidden = [
                      "actual demo mp4 integrated",
                      "open web mp4",
                      "open master mp4",
                      "mp4 integrated",
                  ]
                  claim_safe = not any(text in demo_body for text in forbidden)
                  revision = health.get("revision") or status.get("revision") or ""
                  release_sha = (
                      health.get("releaseCandidateSha")
                      or status.get("releaseCandidateSha")
                      or health.get("release_sha")
                      or status.get("release_sha")
                      or ""
                  )
                  fresh = all(item["status"] == 200 for item in results)
                  no_store = all(
                      "no-store" in item["cacheControl"].lower()
                      for item in results
                      if item["path"] in ("/health", "/status")
                  )

                  receipt = {
                      "schema": "f5.public-demo.deploy-receipt.v1",
                      "generatedAt": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
                      "expectedSha": expected_sha,
                      "revision": revision,
                      "releaseSha": release_sha,
                      "routes": [
                          {key: value for key, value in item.items() if key != "body"}
                          for item in results
                      ],
                      "claimSafe": claim_safe,
                      "noStore": no_store,
                      "pass": fresh and claim_safe and no_store and release_sha == expected_sha,
                  }
                  last = receipt
                  if receipt["pass"]:
                      break
              except Exception as exc:
                  last = {
                      "schema": "f5.public-demo.deploy-receipt.v1",
                      "generatedAt": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
                      "expectedSha": expected_sha,
                      "pass": False,
                      "error": str(exc),
                  }
              time.sleep(delay)

          with open("out/deploy-receipt/public-demo-deploy.json", "w", encoding="utf-8") as handle:
              json.dump(last, handle, indent=2)
              handle.write("\n")
          print(json.dumps(last, indent=2))
          if not last or not last.get("pass"):
              raise SystemExit(1)
          PY

      - name: Write failed pre-verification receipt
        if: failure() && steps.preflight.outputs.ready == 'true'
        run: |
          set -euo pipefail
          if [ -f out/deploy-receipt/public-demo-deploy.json ]; then
            exit 0
          fi
          mkdir -p out/deploy-receipt
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone

          receipt = {
              "schema": "f5.public-demo.deploy-receipt.v1",
              "generatedAt": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
              "expectedSha": os.environ["GITHUB_SHA"],
              "projectId": os.environ.get("GCP_PROJECT_ID", ""),
              "projectNumber": os.environ.get("GCP_PROJECT_NUMBER", ""),
              "state": "FAILED_BEFORE_PUBLIC_VERIFICATION",
              "pass": False,
              "certificationRule": "Authentication or build failure is never public-demo GREEN.",
          }
          with open("out/deploy-receipt/public-demo-deploy.json", "w", encoding="utf-8") as handle:
              json.dump(receipt, handle, indent=2)
              handle.write("\n")
          print(json.dumps(receipt, indent=2))
          PY

      - name: Upload deployment receipt
        if: always() && hashFiles('out/deploy-receipt/public-demo-deploy.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public-demo-deploy-receipt
          path: out/deploy-receipt/public-demo-deploy.json
          if-no-files-found: error
          retention-days: 30

      - name: Skip summary
        if: steps.preflight.outputs.ready != 'true'
        run: |
          echo "OIDC deployment withheld. Missing prerequisites: ${{ steps.preflight.outputs.missing }}"
