name: Public Demo Acceptance
on:
  pull_request:
    paths:
      - 'demo/live-mission-demo.html'
      - 'demo/assets/demo-download-package.json'
      - 'scripts/verify_public_demo_gates.py'
      - '.github/workflows/demo-acceptance.yml'
      - '.github/workflows/publish-artifact-only-pages.yml'
      - 'scripts/test_demo_browser.py'
      - 'scripts/test_published_demo_browser.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-demo-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate public demo and binary distribution boundaries
        run: python3 scripts/verify_public_demo_gates.py
      - name: Check public demo endpoints
        run: python3 scripts/verify_public_demo_gates.py --network
      - name: Install pinned browser testing runtime
        run: |
          python3 -m pip install playwright==1.55.0
          python3 -m playwright install --with-deps chromium
      - name: Exercise Business and Politics browser journeys
        run: python3 scripts/test_demo_browser.py
      - name: Exercise currently published synthetic mission in Chromium (read only)
        run: python3 scripts/test_published_demo_browser.py
