name: Public Demo CI

permissions:
  contents: read
  security-events: write
  pull-requests: read

on:
  push:
    branches: [ main, feature/** ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Enforce ASCII filename policy
        run: bash scripts/check_ascii_filenames.sh

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest black
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Lint with flake8
        run: |
          flake8 . --exclude=.git,__pycache__,.venv,.venv*,venv,node_modules,build,dist --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --exclude=.git,__pycache__,.venv,.venv*,venv,node_modules,build,dist,backups --count --max-complexity=10 --max-line-length=127 --statistics || true

      - name: Check formatting with black
        run: black --check . --exclude '/(\.git|__pycache__|\.venv.*|venv|node_modules|build|dist|backups)/' || true

      - name: Run tests with pytest
        run: |
          if [ -d tests ]; then
            pytest -q tests
          else
            pytest -q
          fi

      - name: Validate retained public bash compatibility surfaces
        run: |
          chmod +x scripts/*.sh *.sh 2>/dev/null || true
          for script in scripts/*.sh *.sh; do
            if [ -f "$script" ]; then
              bash -n "$script" || exit 1
            fi
          done
          echo "Public bash surfaces parsed successfully"

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        continue-on-error: ${{ vars.ENFORCE_TRIVY_SCAN != 'true' }}
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        if: ${{ hashFiles('trivy-results.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: 'trivy-results.sarif'

  artifact-boundary:
    name: Verify non-commanding public boundary
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Confirm public artifact policy is present
        run: |
          test -f policy/public_proof_phi_boundary.yaml
          test -f policy/public_artifact_manifest.yaml
          grep -Fq 'target_state: artifact_only' policy/public_artifact_manifest.yaml
          grep -Fq 'deployment_orchestration_allowed: false' policy/public_artifact_manifest.yaml
          echo "Public artifact boundary contract present"

      - name: Reject deployment-readiness assertions
        run: |
          if grep -R -n -E 'Ready for Docker Desktop Pro deployment|PHI \+ MCP CI/CD Pipeline' .github/workflows --exclude='public-proof-phi-boundary.yml'; then
            echo 'Legacy deployment-readiness assertion remains in public CI.' >&2
            exit 1
          fi
          echo "Public CI is verification-only"
