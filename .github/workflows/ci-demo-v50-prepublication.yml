name: Demo v5 Experience Centre prepublication QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'squarespace/demo-1-v5.0-experience-centre-candidate.html'
      - 'scripts/test_demo_page_v50.py'
      - 'scripts/test_demo_page_v51.py'
      - 'scripts/test_demo_v51_live_content_parity.py'
      - 'squarespace/demo-1-v5.1-live-parity-candidate.html'
      - 'scripts/test_demo_v50_hosted_public.py'
      - '.github/workflows/ci-demo-v50-prepublication.yml'
permissions:
  contents: read
jobs:
  browser-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - name: Install pinned public browser QA dependencies
        run: |
          python3 -m pip install --disable-pip-version-check beautifulsoup4==4.14.3 playwright==1.55.0
          python3 -m playwright install --with-deps chromium
      - name: Verify v5 responsive synthetic mission controls and exact offline artifact
        run: python3 scripts/test_demo_page_v50.py && python3 scripts/test_demo_page_v51.py
      - name: Verify public GitHub Pages Business and Politics media
        run: python3 scripts/test_demo_v50_hosted_public.py
      - name: Verify live Squarespace visible-content parity without editing site
        run: python3 scripts/test_demo_v51_live_content_parity.py
